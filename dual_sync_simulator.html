<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Tahoma,sans-serif;color-scheme:light dark;--bg:#edf3fa;--panel:#fff;--ink:#13243c;--muted:#637891;--line:#d5e2ef;--blue:#1769cb;--blue-soft:#e6f1ff;--green:#067d64;--green-soft:#dff6ed;--orange:#a65a08;--orange-soft:#fff0d8;--red:#ad3545;--red-soft:#ffe9ed;--shadow:0 16px 42px #18345014}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#e8f2ff,var(--bg) 48%,#ecf7f3);color:var(--ink);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--blue)}.wrap{max-width:1720px;margin:auto;padding:24px 22px 52px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{color:var(--blue);font-weight:800;font-size:.84rem}.top h1{font-size:clamp(1.7rem,3vw,2.7rem);margin:.25rem 0 .45rem}.top p{margin:0;color:var(--muted);line-height:1.7;max-width:720px}.top-actions,.row-actions,.tool-actions,.dialog-actions{display:flex;flex-wrap:wrap;gap:8px}.btn,.file-label{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.btn:hover,.file-label:hover{border-color:#8dbef2;background:var(--blue-soft)}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.green{background:var(--green);color:white;border-color:var(--green)}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;min-height:36px;font-size:.85rem}.btn.active{background:var(--blue-soft);color:var(--blue);border-color:#85b9f1}.file-label input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.note{margin:20px 0;border:1px solid #a6d2f6;background:#edf7ff;padding:12px 16px;border-radius:16px;line-height:1.7;color:#245175}.notice-strong{font-weight:800}.layout{display:grid;grid-template-columns:minmax(300px,1fr) minmax(260px,.72fr) minmax(300px,1fr);gap:16px;align-items:start}.device-wrap,.cloud{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow);min-width:0}.device-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.device-top h2,.cloud h2{margin:0;font-size:1.2rem}.sub{color:var(--muted);font-size:.86rem}.badge{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:5px 9px;font-size:.77rem;font-weight:800;background:var(--blue-soft);color:#175a9e}.badge.good{background:var(--green-soft);color:var(--green)}.badge.warn{background:var(--orange-soft);color:var(--orange)}.badge.bad{background:var(--red-soft);color:var(--red)}.settings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field span{font-size:.78rem;color:var(--muted);font-weight:750}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:10px;min-height:42px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1769cb23}.switch-row{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 12px}.switch-row label{display:flex;gap:6px;align-items:center;font-weight:700;color:var(--muted);font-size:.84rem;min-height:38px}.switch-row input{accent-color:var(--blue);width:19px;height:19px}.tool-actions{margin:12px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.metric{border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center;background:#f7fbff}.metric strong{display:block;font-size:1.15rem}.metric span{font-size:.75rem;color:var(--muted)}.phone{border:9px solid #142334;border-radius:39px;background:#f5f7fb;max-width:430px;min-height:560px;margin:auto;overflow:hidden;box-shadow:0 12px 24px #0b223422}.statusbar{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 19px;font-size:.75rem;font-weight:800}.island{width:87px;height:19px;border-radius:16px;background:#0e1824;position:absolute;left:50%;transform:translateX(-50%)}.phone-head{position:relative;background:#fff;border-bottom:1px solid #e1e7ee;padding:13px 16px;text-align:center;font-weight:800}.phone-body{padding:14px;min-height:458px}.phone-body h3{margin:5px 0;font-size:1.25rem}.phone-body .sub{line-height:1.5}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 0;scrollbar-width:thin}.tabs button{border:1px solid #d5e2ef;border-radius:999px;background:#fff;padding:8px 12px;white-space:nowrap;min-height:38px;font-size:.83rem}.tabs button.active{background:#d9eaff;color:#115dae;border-color:#91bff0;font-weight:800}.records{display:grid;gap:8px}.record{background:#fff;border:1px solid #dce6ef;border-radius:14px;padding:10px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}.record-main{min-width:0}.record-main strong{display:block;overflow-wrap:anywhere}.record-main small{display:block;color:#66809b;margin-top:4px;font-size:.74rem}.record .row-actions{flex-shrink:0;gap:3px}.record .btn{border:0;min-height:36px;background:#edf5ff;padding:5px 8px}.record.done .record-main strong{text-decoration:line-through;color:#7b8c9b}.empty{padding:22px;border:1px dashed #b9cfe2;border-radius:14px;text-align:center;color:#6b829a;background:#ffffffa8;line-height:1.6}.phone-foot{text-align:center;padding:5px 0 10px}.home-line{display:block;width:92px;height:4px;background:#8194a8;border-radius:3px;margin:auto}.cloud{position:sticky;top:16px}.cloud h2{display:flex;align-items:center;gap:6px}.flow{display:grid;gap:6px;margin:15px 0}.flow-step{border:1px solid var(--line);border-radius:12px;padding:10px;background:#f7fbff;font-size:.84rem}.flow-arrow{text-align:center;color:var(--blue);font-size:1.2rem}.cloud-space{padding:10px 0;border-top:1px solid var(--line)}.cloud-space h3{margin:0 0 6px;font-size:.9rem;overflow-wrap:anywhere}.cloud-item{display:flex;justify-content:space-between;gap:5px;padding:5px 0;font-size:.78rem;border-bottom:1px dashed var(--line)}.cloud-item span{overflow-wrap:anywhere}.cloud-item small{color:var(--muted);white-space:nowrap}.activity{margin-top:12px;max-height:240px;overflow:auto}.activity li{padding:6px 0;border-bottom:1px solid var(--line);font-size:.78rem;color:var(--muted);line-height:1.4}.footer{margin:18px 0 0;font-size:.83rem;color:var(--muted);line-height:1.7}.toast{position:fixed;inset:auto 50% 20px auto;transform:translateX(50%);background:#17395c;color:#fff;padding:12px 16px;border-radius:13px;z-index:10;max-width:min(560px,94vw);box-shadow:var(--shadow)}.toast[hidden]{display:none}dialog{border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--ink);width:min(440px,92vw);padding:22px;box-shadow:0 24px 80px #152b4670}dialog::backdrop{background:#09213b8a}dialog h2{margin:0 0 14px}.dialog-fields{display:grid;gap:10px}.dialog-actions{margin-top:16px}.json-box{width:100%;min-height:250px;resize:vertical;direction:ltr;text-align:left;font:12px ui-monospace,Menlo,monospace;white-space:pre}.conflict{background:var(--orange-soft);border:1px solid #e8bf84;border-radius:12px;padding:10px;margin:8px 0;font-size:.8rem;line-height:1.5}.conflict .row-actions{margin-top:8px}.sr-only{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}
@media(max-width:1140px){.layout{grid-template-columns:repeat(2,minmax(0,1fr))}.cloud{grid-column:1/-1;grid-row:2;position:static}.flow{grid-template-columns:1fr auto 1fr auto 1fr;align-items:center}.flow-arrow{transform:rotate(90deg)}}
@media(max-width:700px){.wrap{padding:14px 10px 34px}.top{display:block}.top-actions{margin-top:14px}.layout{grid-template-columns:1fr}.cloud{grid-column:auto;grid-row:auto}.device-wrap,.cloud{padding:12px}.settings{grid-template-columns:1fr}.phone{min-height:540px}.flow{display:grid;grid-template-columns:1fr}.flow-arrow{transform:none}}
@media(prefers-color-scheme:dark){:root{--bg:#0c1725;--panel:#172538;--ink:#f1f6ff;--muted:#a2b6cc;--line:#33475f;--blue:#80baff;--blue-soft:#213c5a;--green:#75d6b5;--green-soft:#1b443e;--orange:#f2ba65;--orange-soft:#483520;--red:#ffa2ad;--red-soft:#4b2732;--shadow:0 16px 42px #0005}body{background:linear-gradient(155deg,#12243a,var(--bg) 55%,#102b2a)}.note{background:#173a50;border-color:#376b85;color:#cfebff}.metric,.flow-step{background:#1c3149}.phone{background:#1a293d;border-color:#07121f}.phone-head,.record,.tabs button{background:#223550;color:#f1f6ff;border-color:#3c5775}.phone-body{color:#eff7ff}.empty{background:#1b3048;color:#c4d8eb}.record .btn{background:#29466b}.record-main small{color:#a5bfd8}.tabs button.active{background:#244d79;color:#d8eaff}.home-line{background:#9caec0}}
</style>

<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="editDialog"><form id="recordForm" method="dialog"><h2 id="dialogTitle">سجل تجربة</h2><div class="dialog-fields"><label class="field"><span>العنوان</span><input id="recordTitle" maxlength="100" required></label><label class="field"><span>ملاحظة</span><textarea id="recordNote" maxlength="300" rows="3"></textarea></label><label class="field"><span>الحالة</span><select id="recordStatus"><option value="جديد">جديد</option><option value="جارٍ">جارٍ</option><option value="مكتمل">مكتمل</option><option value="مؤجل">مؤجل</option></select></label></div><div class="dialog-actions"><button class="btn primary" value="save">حفظ محليًا</button><button class="btn" value="cancel">إلغاء</button></div></form></dialog>
<dialog id="jsonDialog"><h2>ملف الجلسة الكامل</h2><p class="sub">يشمل المشروعين وسجلات الجهازين وطوابير التغيير والسحابة التجريبية. احفظ النص بامتداد <bdi dir="ltr">.json</bdi> إذا منع المتصفح التنزيل.</p><textarea id="jsonText" class="json-box" readonly aria-label="JSON الجلسة"></textarea><div class="dialog-actions"><button id="copyJson" class="btn primary" type="button">نسخ JSON</button><button id="closeJson" class="btn" type="button">إغلاق</button></div></dialog>
<script>
(()=>{'use strict';
const FORMAT='dual-sync-simulator/v1', STORAGE='dual-sync-simulator-session-v1', MAX_FILE=8*1024*1024;
const app=document.querySelector('#app'), toastEl=document.querySelector('#toast'), editDialog=document.querySelector('#editDialog'), jsonDialog=document.querySelector('#jsonDialog');
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const text=(value,max=120)=>String(value??'').trim().slice(0,max);
const clone=value=>JSON.parse(JSON.stringify(value));
const uid=()=>globalThis.crypto?.randomUUID?.()||`id-${Date.now()}-${Math.random().toString(36).slice(2)}`;
function freshDevice(index){return {name:`الجهاز ${index+1}`,project:null,projectName:'لم يُستورد مشروع',pages:[],activePage:'',records:{},queue:[],online:true,signedIn:true,account:'حساب تجريبي',container:'مختبر مشترك',lastSync:null};}
function fresh(){return {format:FORMAT,version:1,devices:[freshDevice(0),freshDevice(1)],cloud:{},events:[],counter:0};}
function isObject(value){return !!value&&typeof value==='object'&&!Array.isArray(value);}
function validateSession(raw){if(!isObject(raw)||raw.format!==FORMAT||!Array.isArray(raw.devices)||raw.devices.length!==2||!isObject(raw.cloud))throw Error('هذا ليس ملف جلسة المحاكيين. استورد مشروع كل جهاز من زرّه الخاص.');const cleanState=fresh();cleanState.counter=Number.isFinite(raw.counter)?raw.counter:0;cleanState.events=Array.isArray(raw.events)?raw.events.filter(isObject).slice(0,100):[];cleanState.cloud=raw.cloud;cleanState.devices=raw.devices.map((item,i)=>{if(!isObject(item)||!Array.isArray(item.pages)||!isObject(item.records)||!Array.isArray(item.queue))throw Error('ملف الجلسة ناقص أو غير صالح.');return {...freshDevice(i),...item,name:text(item.name,40)||`الجهاز ${i+1}`,projectName:text(item.projectName,80),pages:item.pages.slice(0,50),queue:item.queue.slice(0,1000),records:item.records,account:text(item.account,80),container:text(item.container,80)};});return cleanState;}
let state;try{const saved=localStorage.getItem(STORAGE);state=saved?validateSession(JSON.parse(saved)):fresh();}catch{state=fresh();}
let editing=null, toastTimer=null;
function notify(message){toastEl.textContent=message;toastEl.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.hidden=true,4200);}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch{notify('تعذر الحفظ التلقائي في هذا المتصفح؛ صدّر ملف الجلسة الآن.');}}
function log(message){state.events.unshift({at:new Date().toISOString(),message:text(message,230)});state.events=state.events.slice(0,100);}
function allItems(source){if(Array.isArray(source))return source.map(item=>typeof item==='string'?item:item?.title||item?.label||'').map(item=>text(item,100)).filter(Boolean).slice(0,80);return String(source??'').split(/[\n،,]+/).map(item=>text(item,100)).filter(Boolean).slice(0,80);}
function extractProject(project){let appName=text(project?.appName||project?.builderState?.appName||'مشروع مستورد',80),pages=[];
 if(Array.isArray(project?.builderState?.tabs)){pages=project.builderState.tabs.slice(0,50).map((tab,index)=>{const pageKey=text(tab.dataKey||`page-${index}`,80);const list=allItems(tab.dataItems);return {key:pageKey,label:text(tab.label||`صفحة ${index+1}`,60),items:list.map((title,row)=>({id:`${pageKey}::${text(tab.rowKeys?.[row]||`row-${row}`,80)}`,title:text(tab.rowState?.[row]?.title||title,100),note:'',status:text(tab.rowState?.[row]?.status||'جديد',30),deleted:!!tab.rowState?.[row]?.deleted}))};});}
 else if(Array.isArray(project?.pages)){pages=project.pages.slice(0,50).map((page,index)=>{const key=text(page.dataKey||page.id||`page-${index}`,80);return {key,label:text(page.title||page.label||`صفحة ${index+1}`,60),items:allItems(page.items||page.dataItems||page.choices||page.dataPresentation?.sampleItems).map((title,row)=>({id:`${key}::row-${row}`,title,note:'',status:'جديد',deleted:false}))};});}
 else if(Array.isArray(project)){appName='مجموعة JSON عامة';pages=[{key:'default',label:'العناصر',items:allItems(project).map((title,row)=>({id:`default::row-${row}`,title,note:'',status:'جديد',deleted:false}))}];}
 else throw Error('صيغة المشروع غير مدعومة. استخدم ملف مشروع المحرر أو JSON يحتوي pages أو مصفوفة عناصر.');
 if(!pages.length)throw Error('ملف المشروع لا يحتوي صفحات قابلة للعرض.');return {appName,pages};}
function scope(device){return `${device.container.trim()} / ${device.account.trim()}`;}
function cloudBucket(device){const key=scope(device);return state.cloud[key]||(state.cloud[key]={records:{},version:0});}
function pending(device,id){return device.queue.find(op=>op.id===id);}
function enqueue(device,record,operation){let item=pending(device,record.id);if(item){item.operation=operation;item.conflict=false;}else device.queue.push({id:record.id,operation,baseRev:Number(record.rev)||0,conflict:false});}
function localRecords(device){return Object.values(device.records).filter(record=>record&&record.pageKey===device.activePage&&!record.deleted).sort((a,b)=>(a.order??0)-(b.order??0));}
function samePayload(a,b){return a&&b&&a.title===b.title&&a.note===b.note&&a.status===b.status&&!!a.deleted===!!b.deleted&&a.pageKey===b.pageKey;}
function importProject(index,project){const extracted=extractProject(project),old=state.devices[index],device=freshDevice(index);device.name=old.name;device.online=old.online;device.signedIn=old.signedIn;device.account=old.account;device.container=old.container;device.project=project;device.projectName=extracted.appName;device.pages=extracted.pages.map(({key,label})=>({key,label}));device.activePage=device.pages[0].key;
 for(const page of extracted.pages)page.items.forEach((item,order)=>{const record={...item,pageKey:page.key,order,rev:0,modifiedAt:new Date().toISOString()};device.records[record.id]=record;enqueue(device,record,record.deleted?'delete':'upsert');});state.devices[index]=device;log(`استُورد «${extracted.appName}» إلى ${device.name}. الصفوف الأولية بيانات تجربة محلية.`);persist();render();notify(`استُورد المشروع إلى ${device.name}. التغييرات المحلية تنتظر المزامنة.`);}
function changeRecord(index,id,fields){const device=state.devices[index],record=device.records[id];if(!record)return;Object.assign(record,fields,{modifiedAt:new Date().toISOString()});enqueue(device,record,record.deleted?'delete':'upsert');log(`تعديل محلي في ${device.name}: ${record.title}`);persist();render();}
function syncDevice(index,quiet=false){const device=state.devices[index];if(!device.project){if(!quiet)notify(`استورد مشروعًا إلى ${device.name} أولًا.`);return false;}if(!device.online||!device.signedIn||!device.account.trim()||!device.container.trim()){if(!quiet)notify(`${device.name}: فعّل الاتصال والحساب وحدد المساحة السحابية.`);return false;}
 const bucket=cloudBucket(device);let pushed=0,pulled=0,conflicts=0;for(const op of [...device.queue]){const local=device.records[op.id],remote=bucket.records[op.id];if(!local){device.queue=device.queue.filter(x=>x!==op);continue;}if(remote&&remote.rev>op.baseRev&&!samePayload(local,remote)){op.conflict=true;conflicts++;continue;}if(remote&&samePayload(local,remote)){device.records[op.id]=clone(remote);device.queue=device.queue.filter(x=>x!==op);continue;}const next={...clone(local),rev:(remote?.rev||0)+1,modifiedAt:new Date().toISOString()};bucket.records[op.id]=next;bucket.version++;device.records[op.id]=clone(next);device.queue=device.queue.filter(x=>x!==op);pushed++;}
 for(const remote of Object.values(bucket.records)){if(!device.pages.some(page=>page.key===remote.pageKey)||pending(device,remote.id))continue;const local=device.records[remote.id];if(!local||remote.rev>local.rev){device.records[remote.id]=clone(remote);pulled++;}}
 device.lastSync=new Date().toISOString();log(`${device.name}: رُفع ${pushed}، نُزّل ${pulled}، تعارض ${conflicts}.`);persist();render();if(!quiet)notify(conflicts?`${device.name}: ${conflicts} تعارض يحتاج قرارك.`:`${device.name}: اكتملت المزامنة التجريبية. رُفع ${pushed} ونُزّل ${pulled}.`);return true;}
function resolveConflict(index,id,choice){const device=state.devices[index],op=pending(device,id),remote=cloudBucket(device).records[id];if(!op||!remote)return;if(choice==='remote'){device.records[id]=clone(remote);device.queue=device.queue.filter(item=>item!==op);log(`${device.name}: اعتُمدت النسخة السحابية للسجل.`);}else{op.baseRev=remote.rev;op.conflict=false;log(`${device.name}: ستُرسل النسخة المحلية عند المزامنة التالية.`);}persist();render();notify('حُفظ قرار التعارض.');}
function metrics(device){return {local:Object.values(device.records).filter(record=>!record.deleted).length,queue:device.queue.length,conflict:device.queue.filter(op=>op.conflict).length};}
function renderRecord(record,index,device){return `<article class="record ${record.status==='مكتمل'?'done':''}"><div class="record-main"><strong>${esc(record.title)}</strong><small>${esc(record.status)} · ${record.rev?`مراجعة سحابية ${record.rev}`:'محلي فقط'}${record.note?` · ${esc(record.note)}`:''}</small></div><div class="row-actions"><button class="btn small" data-action="toggle" data-device="${index}" data-id="${esc(record.id)}" aria-label="تغيير حالة ${esc(record.title)}">✓</button><button class="btn small" data-action="edit" data-device="${index}" data-id="${esc(record.id)}" aria-label="تحرير ${esc(record.title)}">✎</button><button class="btn small danger" data-action="delete" data-device="${index}" data-id="${esc(record.id)}" aria-label="حذف ${esc(record.title)}">×</button></div></article>`;}
function renderDevice(device,index){const count=metrics(device),page=device.pages.find(p=>p.key===device.activePage),rows=localRecords(device);return `<section class="device-wrap" aria-label="${esc(device.name)}"><div class="device-top"><div><h2>${esc(device.name)}</h2><span class="sub">${esc(device.projectName)}</span></div><span class="badge ${count.conflict?'bad':count.queue?'warn':'good'}">${count.conflict?`${count.conflict} تعارض`:count.queue?`${count.queue} بانتظار الرفع`:'متزامن محليًا'}</span></div><div class="settings"><label class="field"><span>حساب iCloud تجريبي</span><input data-setting="account" data-device="${index}" value="${esc(device.account)}" maxlength="80" aria-label="حساب ${esc(device.name)}"></label><label class="field"><span>حاوية CloudKit تجريبية</span><input data-setting="container" data-device="${index}" value="${esc(device.container)}" maxlength="80" aria-label="حاوية ${esc(device.name)}"></label></div><div class="switch-row"><label><input type="checkbox" data-setting="online" data-device="${index}" ${device.online?'checked':''}> متصل بالشبكة</label><label><input type="checkbox" data-setting="signedIn" data-device="${index}" ${device.signedIn?'checked':''}> الحساب متاح</label></div><div class="tool-actions"><label class="file-label">استيراد مشروع JSON<input type="file" data-import-project="${index}" accept=".json,application/json" aria-label="استيراد مشروع ${esc(device.name)}"></label><button class="btn green" data-action="sync" data-device="${index}" ${device.project?'':'disabled'}>مزامنة ${esc(device.name)}</button></div><div class="metrics"><div class="metric"><strong>${count.local}</strong><span>SwiftData محلي</span></div><div class="metric"><strong>${count.queue}</strong><span>طابور CloudKit</span></div><div class="metric"><strong>${device.lastSync?'✓':'—'}</strong><span>آخر مزامنة</span></div></div><div class="phone" aria-label="معاينة ${esc(device.name)}"><div class="statusbar"><span>9:41</span><span class="island" aria-hidden="true"></span><span>●●● ▰</span></div><div class="phone-head">${esc(device.projectName)}</div><div class="phone-body"><div class="sub">${esc(device.name)} · ${device.online?'متصل':'دون اتصال'} · ${device.signedIn?'حساب تجريبي':'الحساب معطّل'}</div>${device.pages.length?`<div class="tabs" role="tablist" aria-label="صفحات ${esc(device.name)}">${device.pages.map(p=>`<button role="tab" aria-selected="${p.key===device.activePage}" class="${p.key===device.activePage?'active':''}" data-action="page" data-device="${index}" data-page="${esc(p.key)}">${esc(p.label)}</button>`).join('')}</div><h3>${esc(page?.label||'الصفحة')}</h3><p class="sub">تعديل السجل يحفظه محليًا أولًا، ثم تنقله المزامنة التجريبية.</p><div class="records">${rows.length?rows.map(record=>renderRecord(record,index,device)).join(''):'<div class="empty">لا توجد سجلات في هذه الصفحة. أضف سجلًا للتجربة.</div>'}</div><div class="tool-actions"><button class="btn primary" data-action="add" data-device="${index}">＋ إضافة سجل</button></div>`:'<div class="empty" style="margin-top:24px">استورد ملف JSON لتظهر صفحات المشروع وسجلاته هنا.</div>'}</div><div class="phone-foot"><span class="home-line"></span></div></div>${device.queue.filter(op=>op.conflict).map(op=>{const local=device.records[op.id],remote=state.cloud[scope(device)]?.records?.[op.id];return `<div class="conflict"><strong>تعارض: ${esc(local?.title||op.id)}</strong><div>المحلي: ${esc(local?.title)} (${esc(local?.status)})<br>السحابي: ${esc(remote?.title||'غير موجود')} (${esc(remote?.status||'—')})</div><div class="row-actions"><button class="btn small" data-action="resolve-local" data-device="${index}" data-id="${esc(op.id)}">احتفظ بالمحلي</button><button class="btn small" data-action="resolve-remote" data-device="${index}" data-id="${esc(op.id)}">خذ السحابي</button></div></div>`;}).join('')}</section>`;}
function renderCloud(){const entries=Object.entries(state.cloud),active=entries.filter(([,bucket])=>Object.keys(bucket.records||{}).length);return `<aside class="cloud" aria-label="السحابة التجريبية"><h2>☁ مساحة المزامنة</h2><p class="sub">CloudKit خاص تجريبي، تفصله الحاوية والحساب. لا يوجد اتصال بخوادم Apple.</p><div class="flow"><div class="flow-step"><strong>① SwiftData</strong><br>سجلات مستقلة على كل جهاز</div><div class="flow-arrow">↔</div><div class="flow-step"><strong>② CloudKit</strong><br>طابور رفع ونسخ ذات مراجعات</div><div class="flow-arrow">↔</div><div class="flow-step"><strong>③ iCloud</strong><br>هوية حساب تجريبية ومساحة خاصة</div></div><button class="btn primary" data-action="sync-both" ${state.devices.some(d=>d.project)?'':'disabled'}>مزامنة الجهازين</button><p class="sub">لرؤية البيانات على الجهازين، استورد المشروع نفسه واضبط الحساب والحاوية بالقيم نفسها.</p><h3>السجلات السحابية</h3>${active.length?active.map(([key,bucket])=>`<div class="cloud-space"><h3>${esc(key)} · مراجعة ${bucket.version}</h3>${Object.values(bucket.records).filter(record=>!record.deleted).slice(0,30).map(record=>`<div class="cloud-item"><span>${esc(record.title)}</span><small>${esc(record.status)} · v${record.rev}</small></div>`).join('')||'<div class="sub">لا توجد سجلات ظاهرة</div>'}</div>`).join(''):'<div class="empty">لا توجد بيانات سحابية بعد. مزامنات الجهازين ستظهر هنا.</div>'}<h3>سجل التجربة</h3><ol class="activity">${state.events.length?state.events.slice(0,15).map(event=>`<li>${esc(event.message)}</li>`).join(''):'<li>ابدأ باستيراد المشروعين.</li>'}</ol></aside>`;}
function render(){app.innerHTML=`<header class="top"><div><div class="eyebrow">مختبر مستقل · جهازان</div><h1>محاكي المزامنة بين جهازين</h1><p>استورد مشروع JSON لكل جهاز، غيّر سجلاته محليًا، ثم جرّب الرفع والتنزيل والتعارض وانقطاع الاتصال. احفظ حالة الجهازين والسحابة في ملف واحد لتكملها لاحقًا.</p></div><div class="top-actions"><button class="btn primary" data-action="export">تنزيل جلسة JSON</button><button class="btn" data-action="show-json">عرض JSON للنسخ</button><label class="file-label">استيراد جلسة كاملة<input type="file" id="sessionFile" accept=".json,application/json" aria-label="استيراد جلسة المحاكيين"></label></div></header><div class="note"><span class="notice-strong">حدود المحاكاة:</span> التخزين المحلي وطابور التغييرات وتبادل السجلات يعملون داخل هذا المتصفح فقط. أسماء SwiftData وCloudKit وiCloud هنا تشرح دورة البيانات؛ لا تشغّل خدمات Apple الأصلية ولا تثبت عمل المشروع المصدّر في Xcode.</div><main class="layout">${renderDevice(state.devices[0],0)}${renderCloud()}${renderDevice(state.devices[1],1)}</main><p class="footer">يحفظ المتصفح الجلسة تلقائيًا على هذا الجهاز. الرابط العام لا يتضمن مشاريعك أو سجلاتك؛ لنقلها استخدم «تنزيل جلسة JSON» ثم «استيراد جلسة كاملة». ملفات المشاريع الأصلية محفوظة داخل ملف الجلسة.</p>`;}
function sessionJson(){return JSON.stringify({...state,exportedAt:new Date().toISOString(),simulationOnly:true},null,2);}
function downloadSession(){const data=sessionJson(),blob=new Blob([data],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Dual_Device_Sync_Session.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notify('طُلب تنزيل ملف الجلسة. إن منع المتصفح التنزيل، استخدم عرض JSON للنسخ.');}
function openJson(){document.querySelector('#jsonText').value=sessionJson();jsonDialog.showModal();}
function openEdit(index,id){const device=state.devices[index],record=id?device.records[id]:null;editing={index,id:id||null};document.querySelector('#dialogTitle').textContent=record?'تحرير سجل محلي':'إضافة سجل محلي';document.querySelector('#recordTitle').value=record?.title||'';document.querySelector('#recordNote').value=record?.note||'';document.querySelector('#recordStatus').value=record?.status||'جديد';editDialog.showModal();document.querySelector('#recordTitle').focus();}
function fileJson(file){if(!file)throw Error('لم يُحدد ملف.');if(file.size>MAX_FILE)throw Error('الملف أكبر من الحد المسموح (8 ميغابايت).');return file.text().then(content=>JSON.parse(content));}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action,index=Number(button.dataset.device),id=button.dataset.id,device=state.devices[index];
 if(action==='export')downloadSession();else if(action==='show-json')openJson();else if(action==='sync-both'){syncDevice(0,true);syncDevice(1,true);syncDevice(0,true);notify('اكتملت جولة المزامنة التجريبية. راجع التعارضات إن ظهرت.');}
 else if(action==='sync')syncDevice(index);else if(action==='page'){device.activePage=button.dataset.page;persist();render();}else if(action==='add')openEdit(index,null);else if(action==='edit')openEdit(index,id);else if(action==='toggle'){const record=device.records[id];changeRecord(index,id,{status:record.status==='مكتمل'?'جارٍ':'مكتمل'});}else if(action==='delete')changeRecord(index,id,{deleted:true});else if(action==='resolve-local')resolveConflict(index,id,'local');else if(action==='resolve-remote')resolveConflict(index,id,'remote');});
document.addEventListener('change',async event=>{const input=event.target;try{if(input.matches('[data-import-project]')){const index=Number(input.dataset.importProject),project=await fileJson(input.files[0]);importProject(index,project);}else if(input.id==='sessionFile'){const imported=await fileJson(input.files[0]);state=validateSession(imported);log('استُعيدت جلسة الجهازين والسحابة من JSON.');persist();render();notify('استُعيدت الجلسة كاملةً.');}else if(input.matches('[data-setting]')){const index=Number(input.dataset.device),field=input.dataset.setting,device=state.devices[index];if(['online','signedIn'].includes(field))device[field]=input.checked;else device[field]=text(input.value,80);log(`${device.name}: تغيّر إعداد ${field}.`);persist();render();}}catch(error){notify(`تعذر الاستيراد: ${error.message}`);input.value='';}});
document.querySelector('#recordForm').addEventListener('submit',event=>{if(event.submitter?.value!=='save'||!editing)return;const title=text(document.querySelector('#recordTitle').value,100);if(!title){event.preventDefault();notify('أدخل عنوانًا للسجل.');return;}const {index,id}=editing,device=state.devices[index],note=text(document.querySelector('#recordNote').value,300),status=text(document.querySelector('#recordStatus').value,30);if(id)changeRecord(index,id,{title,note,status});else{const record={id:`${device.activePage}::${uid()}`,pageKey:device.activePage,title,note,status,order:Object.keys(device.records).length,rev:0,deleted:false,modifiedAt:new Date().toISOString()};device.records[record.id]=record;enqueue(device,record,'upsert');log(`أُضيف محليًا إلى ${device.name}: ${title}`);persist();render();}editing=null;notify('حُفظ السجل محليًا؛ زامن الجهاز لإرساله للسحابة التجريبية.');});
document.querySelector('#closeJson').addEventListener('click',()=>jsonDialog.close());document.querySelector('#copyJson').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(document.querySelector('#jsonText').value);notify('نُسخ JSON الجلسة.');}catch{document.querySelector('#jsonText').select();notify('حدد النص وانسخه يدويًا من النافذة.');}});
render();
})();
</script>
</body>
</html>
