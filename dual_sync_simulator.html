d var(--line);font-size:.78rem;color:var(--muted);line-height:1.4}.footer{margin:18px 0 0;font-size:.83rem;color:var(--muted);line-height:1.7}.toast{position:fixed;inset:auto 50% 20px auto;transform:translateX(50%);background:#17395c;color:#fff;padding:12px 16px;border-radius:13px;z-index:10;max-width:min(560px,94vw);box-shadow:var(--shadow)}.toast[hidden]{display:none}dialog{border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--ink);width:min(440px,92vw);padding:22px;box-shadow:0 24px 80px #152b4670}dialog::backdrop{background:#09213b8a}dialog h2{margin:0 0 14px}.dialog-fields{display:grid;gap:10px}.dialog-actions{margin-top:16px}.json-box{width:100%;min-height:250px;resize:vertical;direction:ltr;text-align:left;font:12px ui-monospace,Menlo,monospace;white-space:pre}.conflict{background:var(--orange-soft);border:1px solid #e8bf84;border-radius:12px;padding:10px;margin:8px 0;font-size:.8rem;line-height:1.5}.conflict .row-actions{margin-top:8px}.sr-only{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}

<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="editDialog"><form id="recordForm" method="dialog"><h2 id="dialogTitle">سجل تجربة</h2><div class="dialog-fields"><label class="field"><span>العنوان</span><input id="recordTitle" maxlength="100" required></label><label class="field"><span>ملاحظة</span><textarea id="recordNote" maxlength="300" rows="3"></textarea></label><label class="field"><span>الحالة</span><select id="recordStatus"><option value="جديد">جديد</option><option value="جارٍ">جارٍ</option><option value="مكتمل">مكتمل</option><option value="مؤجل">مؤجل</option></select></label></div><div class="dialog-actions"><button class="btn primary" value="save">حفظ محليًا</button><button class="btn" value="cancel">إلغاء</button></div></form></dialog>
<dialog id="jsonDialog"><h2>ملف الجلسة الكامل</h2><p class="sub">يشمل المشروعين وسجلات الجهازين وطوابير التغيير والسحابة التجريبية. احفظ النص بامتداد <bdi dir="ltr">.json</bdi> إذا منع المتصفح التنزيل.</p><textarea id="jsonText" class="json-box" readonly aria-label="JSON الجلسة"></textarea><div class="dialog-actions"><button id="copyJson" class="btn primary" type="button">نسخ JSON</button><button id="closeJson" class="btn" type="button">إغلاق</button></div></dialog>
<script>
(()=>{'use strict';
const FORMAT='dual-sync-simulator/v2', LEGACY_FORMAT='dual-sync-simulator/v1', STORAGE='dual-sync-simulator-session-v1', MAX_FILE=8*1024*1024, SHARED_PAGE='__shared_exchange__';
const app=document.querySelector('#app'), toastEl=document.querySelector('#toast'), editDialog=document.querySelector('#editDialog'), jsonDialog=document.querySelector('#jsonDialog');
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const text=(value,max=120)=>String(value??'').trim().slice(0,max);
const clone=value=>JSON.parse(JSON.stringify(value));
const uid=()=>globalThis.crypto?.randomUUID?.()||`id-${Date.now()}-${Math.random().toString(36).slice(2)}`;
function freshDevice(index){return {name:`iPhone · التطبيق ${index+1}`,appId:'',project:null,projectName:'لم يُستورد تطبيق',pages:[],activePage:'',records:{},queue:[],lastSync:null};}
function fresh(){return {format:FORMAT,version:2,identity:{account:'حساب تجريبي واحد',container:'مساحة تبادل مشتركة',online:true,signedIn:true},devices:[freshDevice(0),freshDevice(1)],cloud:{},events:[],counter:0,migrationNotice:'',migrationBlocked:false};}
function isObject(value){return !!value&&typeof value==='object'&&!Array.isArray(value);}
function validateSession(raw){
 if(!isObject(raw)||![FORMAT,LEGACY_FORMAT].includes(raw.format)||!Array.isArray(raw.devices)||raw.devices.length!==2||!isObject(raw.cloud))throw Error('هذا ليس ملف جلسة الهاتفين. استورد ملف كل تطبيق من زرّه الخاص.');
 const legacy=raw.format===LEGACY_FORMAT,cleanState=fresh();
 cleanState.counter=Number.isFinite(raw.counter)?raw.counter:0;
 cleanState.events=Array.isArray(raw.events)?raw.events.filter(isObject).slice(0,100):[];
 cleanState.identity={account:text(raw.identity?.account||raw.devices[0]?.account||cleanState.identity.account,80),container:text(raw.identity?.container||raw.devices[0]?.container||cleanState.identity.container,80),online:raw.identity?.online!==undefined?!!raw.identity.online:raw.devices.every(device=>device.online!==false),signedIn:raw.identity?.signedIn!==undefined?!!raw.identity.signedIn:raw.devices.every(device=>device.signedIn!==false)};
 cleanState.cloud=raw.cloud;
 cleanState.devices=raw.devices.map((item,i)=>{
  if(!isObject(item)||!Array.isArray(item.pages)||!isObject(item.records)||!Array.isArray(item.queue))throw Error('ملف الجلسة ناقص أو غير صالح.');
  const device={...freshDevice(i),...item,name:freshDevice(i).name,appId:text(item.appId||`legacy-app-${i+1}`,100),projectName:text(item.projectName,80),pages:item.pages.slice(0,50),queue:item.queue.slice(0,1000),records:item.records};
  if(legacy)for(const record of Object.values(device.records)){if(!isObject(record))continue;record.shared=true;record.ownerAppId=device.appId;record.sourceApp=device.projectName;}
  delete device.account;delete device.container;delete device.online;delete device.signedIn;
  return device;
 });
 if(legacy){for(const bucket of Object.values(cleanState.cloud))for(const record of Object.values(bucket?.records||{})){if(isObject(record)){record.shared=true;record.ownerAppId||='legacy-cloud';record.sourceApp||='جلسة سابقة';}}
  const other=raw.devices[1];if(other.account!==cleanState.identity.account||other.container!==cleanState.identity.container){cleanState.migrationBlocked=true;cleanState.migrationNotice='كانت الجلسة القديمة تستخدم حسابين أو مساحتين مختلفتين؛ توقفت مزامنتها لتجنب نقل البيانات إلى حساب خاطئ. صدّرها، ثم ابدأ جلسة موحدة جديدة.';}else cleanState.migrationNotice='استُعيدت جلسة قديمة؛ سجلاتها المشتركة السابقة باقية. الاستيرادات الجديدة تبدأ بسجلات خاصة.';
 }
 return cleanState;
}
let state;try{const saved=localStorage.getItem(STORAGE);state=saved?validateSession(JSON.parse(saved)):fresh();}catch{state=fresh();}
let editing=null, toastTimer=null;
function notify(message){toastEl.textContent=message;toastEl.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.hidden=true,4200);}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch{notify('تعذر الحفظ التلقائي في هذا المتصفح؛ صدّر ملف الجلسة الآن.');}}
function log(message){state.events.unshift({at:new Date().toISOString(),message:text(message,230)});state.events=state.events.slice(0,100);}
function allItems(source){if(Array.isArray(source))return source.map(item=>typeof item==='string'?item:item?.title||item?.label||'').map(item=>text(item,100)).filter(Boolean).slice(0,80);return String(source??'').split(/[\n،,]+/).map(item=>text(item,100)).filter(Boolean).slice(0,80);}
function extractProject(project){let appName=text(project?.appName||project?.builderState?.appName||'مشروع مستورد',80),pages=[];
 if(Array.isArray(project?.builderState?.tabs)){pages=project.builderState.tabs.slice(0,50).map((tab,index)=>{const pageKey=text(tab.dataKey||`page-${index}`,80);const list=allItems(tab.dataItems);return {key:pageKey,label:text(tab.label||`صفحة ${index+1}`,60),items:list.map((title,row)=>({id:`${pageKey}::${text(tab.rowKeys?.[row]||`row-${row}`,80)}`,title:text(tab.rowState?.[row]?.title||title,100),note:'',status:text(tab.rowState?.[row]?.status||'جديد',30),deleted:!!tab.rowState?.[row]?.deleted}))};});}
 else if(Array.isArray(project?.pages)){pages=project.pages.slice(0,50).map((page,index)=>{const key=text(page.dataKey||page.id||`page-${index}`,80);return {key,label:text(page.title||page.label||`صفحة ${index+1}`,60),items:allItems(page.items||page.dataItems||page.choices||page.dataPresentation?.sampleItems).map((title,row)=>({id:`${key}::row-${row}`,title,note:'',status:'جديد',deleted:false}))};});}
 else if(Array.isArray(project)){appName='مجموعة JSON عامة';pages=[{key:'default',label:'العناصر',items:allItems(project).map((title,row)=>({id:`default::row-${row}`,title,note:'',status:'جديد',deleted:false}))}];}
 else throw Error('صيغة المشروع غير مدعومة. استخدم ملف مشروع المحرر أو JSON يحتوي pages أو مصفوفة عناصر.');
 if(!pages.length)throw Error('ملف المشروع لا يحتوي صفحات قابلة للعرض.');return {appName,pages};}
function scope(){return `${state.identity.container.trim()} / ${state.identity.account.trim()}`;}
function cloudBucket(){const key=scope();return state.cloud[key]||(state.cloud[key]={records:{},version:0});}
function pending(device,id){return device.queue.find(op=>op.id===id);}
function enqueue(device,record,operation){if(!record.shared)return;let item=pending(device,record.id);if(item){item.operation=operation;item.conflict=false;}else device.queue.push({id:record.id,operation,baseRev:Number(record.rev)||0,scope:scope(),conflict:false});}
function localRecords(device){return Object.values(device.records).filter(record=>record&&record.ownerAppId===device.appId&&record.pageKey===device.activePage&&!record.deleted).sort((a,b)=>(a.order??0)-(b.order??0));}
function sharedRecords(device){return Object.values(device.records).filter(record=>record&&record.shared&&!record.deleted).sort((a,b)=>String(b.modifiedAt||'').localeCompare(String(a.modifiedAt||'')));}
function samePayload(a,b){return a&&b&&a.title===b.title&&a.note===b.note&&a.status===b.status&&!!a.deleted===!!b.deleted&&a.pageKey===b.pageKey;}
function importProject(index,project,replaceConfirmed=false){
 const extracted=extractProject(project),old=state.devices[index];
 if(old.project&&!replaceConfirmed&&!confirm(`استبدال تطبيق ${old.projectName} على ${old.name}؟ سيُحذف مخزنه المحلي وطابوره هنا، وتبقى السجلات المنشورة في السحابة التجريبية.`))return false;
 const device=freshDevice(index);device.appId=`app-${uid()}`;device.project=project;device.projectName=extracted.appName;device.pages=extracted.pages.map(({key,label})=>({key,label}));device.activePage=device.pages[0].key;
 for(const page of extracted.pages)page.items.forEach((item,order)=>{const record={...item,id:`${device.appId}::${item.id}`,pageKey:page.key,order,rev:0,shared:false,ownerAppId:device.appId,sourceApp:extracted.appName,sourcePage:page.label,modifiedAt:new Date().toISOString()};device.records[record.id]=record;});
 state.devices[index]=device;log(`استُورد تطبيق «${extracted.appName}» إلى ${device.name}. صفوفه خاصة حتى تشارك واحدًا منها.`);persist();render();notify(`استُورد ${extracted.appName}. اختر «مشاركة» على سجل ليظهر في التطبيق الآخر بعد المزامنة.`);return true;
}
function changeRecord(index,id,fields){const device=state.devices[index],record=device.records[id];if(!record)return;Object.assign(record,fields,{modifiedAt:new Date().toISOString()});enqueue(device,record,record.deleted?'delete':'upsert');log(`تعديل ${record.shared?'مشترك':'خاص'} في ${device.projectName}: ${record.title}`);persist();render();}
function shareRecord(index,id){const device=state.devices[index],record=device.records[id];if(!record||record.shared||record.deleted||record.ownerAppId!==device.appId)return;record.shared=true;record.sourceApp=device.projectName;record.sourcePage=device.pages.find(page=>page.key===record.pageKey)?.label||'صفحة التطبيق';record.modifiedAt=new Date().toISOString();enqueue(device,record,'upsert');log(`نُسخ «${record.title}» من ${device.projectName} إلى طابور التبادل.`);persist();render();notify('أُضيف السجل إلى طابور المشاركة. زامن التطبيقين لنقله.');}
function syncDevice(index,quiet=false){
 const device=state.devices[index];if(!device.project){if(!quiet)notify(`استورد تطبيقًا إلى ${device.name} أولًا.`);return false;}
 if(state.migrationBlocked||!state.identity.online||!state.identity.signedIn||!state.identity.account.trim()||!state.identity.container.trim()){if(!quiet)notify(state.migrationBlocked?'الجلسة القديمة استخدمت حسابين مختلفين؛ ابدأ جلسة موحدة بعد تصديرها.':'فعّل اتصال iPhone والحساب المشترك.');return false;}
 const bucket=cloudBucket();let pushed=0,pulled=0,conflicts=0,wrongScope=0;
 for(const op of [...device.queue]){
  if(op.scope&&op.scope!==scope()){wrongScope++;continue;}
  const local=device.records[op.id],remote=bucket.records[op.id];
  if(!local||!local.shared){device.queue=device.queue.filter(x=>x!==op);continue;}
  if(remote&&remote.rev>op.baseRev&&!samePayload(local,remote)){op.conflict=true;conflicts++;continue;}
  if(remote&&samePayload(local,remote)){device.records[op.id]=clone(remote);device.queue=device.queue.filter(x=>x!==op);continue;}
  const next={...clone(local),rev:(remote?.rev||0)+1,modifiedAt:new Date().toISOString()};bucket.records[op.id]=next;bucket.version++;device.records[op.id]=clone(next);device.queue=device.queue.filter(x=>x!==op);pushed++;
 }
 for(const remote of Object.values(bucket.records)){
  if(!remote.shared||pending(device,remote.id))continue;
  const local=device.records[remote.id];if(!local||remote.rev>local.rev){device.records[remote.id]=clone(remote);pulled++;}
 }
 device.lastSync=new Date().toISOString();log(`${device.projectName} على ${device.name}: رُفع ${pushed}، نُزّل ${pulled}، تعارض ${conflicts}${wrongScope?`، طابور لمساحة أخرى ${wrongScope}`:''}.`);persist();render();
 if(!quiet)notify(wrongScope?`${wrongScope} تغيير مرتبط بمساحة سابقة ولم يُرسل.`:conflicts?`${device.name}: ${conflicts} تعارض يحتاج قرارك.`:`${device.name}: رُفع ${pushed} ونُزّل ${pulled} سجل مشترك.`);
 return true;
}
function resolveConflict(index,id,choice){const device=state.devices[index],op=pending(device,id),remote=cloudBucket().records[id];if(!op||!remote)return;if(choice==='remote'){device.records[id]=clone(remote);device.queue=device.queue.filter(item=>item!==op);log(`${device.name}: اعتُمدت النسخة السحابية للسجل.`);}else{op.baseRev=remote.rev;op.conflict=false;log(`${device.name}: ستُرسل النسخة المحلية عند المزامنة التالية.`);}persist();render();notify('حُفظ قرار التعارض.');}
function metrics(device){const records=Object.values(device.records).filter(record=>record&&!record.deleted);return {private:records.filter(record=>record.ownerAppId===device.appId&&!record.shared).length,shared:records.filter(record=>record.shared).length,queue:device.queue.length,conflict:device.queue.filter(op=>op.conflict).length};}
function renderRecord(record,index,device){const own=record.ownerAppId===device.appId;return `<article class="record ${record.shared?'shared':'private'} ${record.status==='مكتمل'?'done':''}"><div class="record-main"><strong>${esc(record.title)}</strong><small>${esc(record.status)} · ${record.rev?`نسخة مشتركة ${record.rev}`:record.shared?'بانتظار المشاركة':'خاص بهذا التطبيق'}${record.note?` · ${esc(record.note)}`:''}</small>${record.shared?`<small class="shared-source">المصدر: ${esc(record.sourceApp||'تطبيق سابق')}${record.sourcePage?` · ${esc(record.sourcePage)}`:''}</small>`:''}</div><div class="row-actions">${own&&!record.shared?`<button class="btn small" data-action="share" data-device="${index}" data-id="${esc(record.id)}" aria-label="مشاركة ${esc(record.title)}">مشاركة</button>`:''}<button class="btn small" data-action="toggle" data-device="${index}" data-id="${esc(record.id)}" aria-label="تغيير حالة ${esc(record.title)}">✓</button><button class="btn small" data-action="edit" data-device="${index}" data-id="${esc(record.id)}" aria-label="تحرير ${esc(record.title)}">✎</button><button class="btn small danger" data-action="delete" data-device="${index}" data-id="${esc(record.id)}" aria-label="حذف ${esc(record.title)}">×</button></div></article>`;}
function renderDevice(device,index){
 const count=metrics(device),sharedView=device.activePage===SHARED_PAGE,page=device.pages.find(p=>p.key===device.activePage),rows=sharedView?sharedRecords(device):localRecords(device);
 return `<section class="device-wrap" aria-label="${esc(device.name)}"><div class="device-top"><div><h2>${esc(device.name)}</h2><span class="sub">تطبيق: ${esc(device.projectName)}</span><br><span class="account-chip">الحساب نفسه · ${esc(state.identity.account)}</span></div><span class="badge ${count.conflict?'bad':count.queue?'warn':'good'}">${count.conflict?`${count.conflict} تعارض`:count.queue?`${count.queue} بانتظار الرفع`:'لا تغييرات معلقة'}</span></div><div class="tool-actions"><label class="file-label">استيراد تطبيق JSON<input type="file" data-import-project="${index}" accept=".json,application/json" aria-label="استيراد تطبيق ${esc(device.name)}"></label><button class="btn green" data-action="sync" data-device="${index}" ${device.project?'':'disabled'}>مزامنة التطبيق</button></div><div class="metrics"><div class="metric"><strong>${count.private}</strong><span>سجلات خاصة محلية</span></div><div class="metric"><strong>${count.shared}</strong><span>سجلات مشتركة</span></div><div class="metric"><strong>${count.queue}</strong><span>تغييرات معلقة</span></div></div><div class="phone" aria-label="معاينة تطبيق ${esc(device.projectName)} على ${esc(device.name)}"><div class="statusbar"><span>9:41</span><span class="island" aria-hidden="true"></span><span>●●● ▰</span></div><div class="phone-head">${esc(device.projectName)}</div><div class="phone-body"><div class="sub">${esc(device.name)} · ${state.identity.online?'متصل':'دون اتصال'} · ${state.identity.signedIn?'الحساب متاح':'الحساب معطّل'}</div>${device.pages.length?`<div class="tabs" role="tablist" aria-label="صفحات ${esc(device.projectName)}">${device.pages.map(p=>`<button role="tab" aria-selected="${p.key===device.activePage}" class="${p.key===device.activePage?'active':''}" data-action="page" data-device="${index}" data-page="${esc(p.key)}">${esc(p.label)}</button>`).join('')}<button role="tab" aria-selected="${sharedView}" class="${sharedView?'active':''}" data-action="page" data-device="${index}" data-page="${SHARED_PAGE}">التبادل المشترك (${count.shared})</button></div><h3>${sharedView?'التبادل المشترك':esc(page?.label||'الصفحة')}</h3><p class="sub">${sharedView?'تظهر هنا السجلات التي نُشرت صراحةً من أي تطبيق بعد المزامنة. يمكن تعديل النسخة المشتركة من أي الهاتفين.':'هذه صفوف تطبيقك الخاصة. اختر «مشاركة» لسجل محدد كي ينتقل إلى التطبيق الآخر.'}</p><div class="records">${rows.length?rows.map(record=>renderRecord(record,index,device)).join(''):`<div class="empty">${sharedView?'لا توجد سجلات مشتركة بعد. شارك سجلًا من إحدى صفحات التطبيق ثم زامن الهاتفين.':'لا توجد سجلات في هذه الصفحة. أضف سجلًا خاصًا للتجربة.'}</div>`}</div><div class="tool-actions"><button class="btn primary" data-action="add" data-device="${index}">＋ ${sharedView?'سجل مشترك جديد':'سجل خاص جديد'}</button></div>`:'<div class="empty" style="margin-top:24px">استورد تطبيق JSON لتظهر صفحاته هنا. يمكنك اختيار تطبيق مختلف للهاتف الآخر.</div>'}</div><div class="phone-foot"><span class="home-line"></span></div></div>${device.queue.filter(op=>op.conflict).map(op=>{const local=device.records[op.id],remote=state.cloud[scope()]?.records?.[op.id];return `<div class="conflict"><strong>تعارض: ${esc(local?.title||op.id)}</strong><div>المحلي: ${esc(local?.title)} (${esc(local?.status)})<br>السحابي: ${esc(remote?.title||'غير موجود')} (${esc(remote?.status||'—')})</div><div class="row-actions"><button class="btn small" data-action="resolve-local" data-device="${index}" data-id="${esc(op.id)}">احتفظ بالمحلي</button><button class="btn small" data-action="resolve-remote" data-device="${index}" data-id="${esc(op.id)}">خذ السحابي</button></div></div>`;}).join('')}</section>`;
}
function renderCloud(){
 const locked=state.devices.some(device=>device.project)||Object.keys(state.cloud).length>0,bucket=state.cloud[scope()],shared=Object.values(bucket?.records||{}).filter(record=>record.shared&&!record.deleted),left=state.devices[0].projectName,right=state.devices[1].projectName;
 return `<aside class="cloud" aria-label="مساحة التبادل التجريبية"><h2>☁ حساب واحد وتبادل محدد</h2><p class="sub">اللوحتان تمثلان iPhone نفسه بحساب تجريبي واحد؛ يبقى مخزن كل تطبيق منفصلًا.</p><div class="settings ${locked?'identity-locked':''}"><label class="field"><span>اسم الحساب التجريبي المشترك</span><input data-global-setting="account" value="${esc(state.identity.account)}" maxlength="80" ${locked?'disabled':''}></label><label class="field"><span>مساحة CloudKit التجريبية المشتركة</span><input data-global-setting="container" value="${esc(state.identity.container)}" maxlength="80" ${locked?'disabled':''}></label></div><div class="switch-row" style="margin-top:12px"><label><input type="checkbox" data-global-setting="online" ${state.identity.online?'checked':''}> اتصال iPhone نفسه</label><label><input type="checkbox" data-global-setting="signedIn" ${state.identity.signedIn?'checked':''}> حساب iCloud التجريبي متاح</label></div><p class="identity-hint">${locked?'تُثبت هوية الحساب والمساحة بعد استيراد تطبيق أو بدء المزامنة. لبدء حساب آخر، ابدأ جلسة جديدة.':'يمكن تعديل الاسمَين قبل استيراد أول تطبيق.'}</p><div class="flow"><div class="flow-step flow-app"><strong>${esc(left)}</strong><small>SwiftData خاص · التطبيق الأول</small></div><div class="flow-arrow">↔</div><div class="flow-step flow-app"><strong>سجلات تبادل مشتركة</strong><small>عنوان · ملاحظة · حالة · مصدر · مراجعة</small></div><div class="flow-arrow">↔</div><div class="flow-step flow-app"><strong>${esc(right)}</strong><small>SwiftData خاص · التطبيق الثاني</small></div></div><button class="btn primary" data-action="sync-both" ${state.devices.every(device=>device.project)?'':'disabled'}>مزامنة التطبيقين</button><p class="sub">استورد <b>تطبيقين مختلفين</b> على iPhone نفسه، شارك سجلًا بعينه من الأول، ثم زامن التطبيقين. لا تنتقل الصفوف الخاصة تلقائيًا.</p><h3>مساحة التبادل · ${esc(scope())}</h3>${shared.length?shared.slice(0,30).map(record=>`<div class="cloud-item"><span>${esc(record.title)} <small>من ${esc(record.sourceApp||'تطبيق سابق')}</small></span><small>${esc(record.status)} · v${record.rev}</small></div>`).join(''):'<div class="empty">لا توجد سجلات منشورة. اختر «مشاركة» على سجل داخل أحد التطبيقين.</div>'}<h3>سجل التجربة</h3><ol class="activity">${state.events.length?state.events.slice(0,15).map(event=>`<li>${esc(event.message)}</li>`).join(''):'<li>ابدأ باستيراد تطبيقين مختلفين أو حمّل المثال العام.</li>'}</ol></aside>`;
}
function render(){app.innerHTML=`<header class="top"><div><div class="eyebrow">مختبر مستقل · iPhone واحد · لوحتا تطبيقين</div><h1>تجربة تطبيقين على حساب واحد</h1><p>استورد JSON مختلفًا في كل لوحة من لوحتي iPhone نفسه. صفحات كل تطبيق وسجلاته الخاصة تبقى مستقلة، بينما تنتقل فقط السجلات التي تختار مشاركتها عبر مساحة تبادل تجريبية.</p><div class="steps"><span class="step">① استورد تطبيقًا في كل لوحة</span><span class="step">② شارك سجلًا محددًا</span><span class="step">③ زامن وجرّب التعديل من التطبيق الآخر</span></div></div><div class="top-actions"><button class="btn" data-action="demo">مثال: مهام + ملاحظات</button><details class="session-tools"><summary class="btn">حفظ واستيراد الجلسة ▾</summary><div class="session-menu"><button class="btn primary" data-action="export">تنزيل جلسة JSON</button><button class="btn" data-action="show-json">عرض JSON للنسخ</button><label class="file-label">استيراد جلسة كاملة<input type="file" id="sessionFile" accept=".json,application/json" aria-label="استيراد جلسة التطبيقين"></label><button class="btn danger" data-action="reset">جلسة جديدة</button></div></details></div></header><details class="note"><summary>محاكاة داخل المتصفح فقط · استخدم بيانات تجريبية${state.migrationBlocked?' · جلسة قديمة متوقفة':''}</summary><div class="note-body">التخزين المحلي والتبادل والطابور والتعارض تعمل هنا فقط. تعرض كل لوحة صفحات المشروع وسجلاته بصورة مبسطة لا واجهته الأصلية الكاملة. لا تُشغَّل SwiftData أو CloudKit أو iCloud الأصلية. في تطبيق Apple حقيقي، الحساب نفسه وحده لا يكفي؛ يحتاج التطبيقان إلى حاوية مصرح بها ومخطط بيانات متوافق. <a href="https://developer.apple.com/documentation/cloudkit/enabling-cloudkit-in-your-app" target="_blank" rel="noopener noreferrer">إعداد CloudKit لدى Apple ↗</a><br><span class="privacy">ملف الجلسة يحتوي مشروعي التطبيقين وسجلاتهما.</span>${state.migrationNotice?`<br>${esc(state.migrationNotice)}`:''}</div></details><main class="layout">${renderDevice(state.devices[0],0)}${renderCloud()}${renderDevice(state.devices[1],1)}</main><p class="footer">يحفظ هذا المتصفح الجلسة تلقائيًا على الجهاز الحالي. الرابط العام لا يحتوي المشروعين أو البيانات. انقل الجلسة بملف JSON المصدر، ثم استورد الملف على متصفح آخر.</p>`;}
function sessionJson(){return JSON.stringify({...state,exportedAt:new Date().toISOString(),simulationOnly:true},null,2);}
function downloadSession(){const data=sessionJson(),blob=new Blob([data],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Dual_Device_Sync_Session.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notify('طُلب تنزيل ملف الجلسة. إن منع المتصفح التنزيل، استخدم عرض JSON للنسخ.');}
function openJson(){document.querySelector('#jsonText').value=sessionJson();jsonDialog.showModal();}
function openEdit(index,id){const device=state.devices[index],record=id?device.records[id]:null;editing={index,id:id||null};document.querySelector('#dialogTitle').textContent=record?`تحرير سجل ${record.shared?'مشترك':'خاص'}`:device.activePage===SHARED_PAGE?'إضافة سجل مشترك':'إضافة سجل خاص';document.querySelector('#recordTitle').value=record?.title||'';document.querySelector('#recordNote').value=record?.note||'';document.querySelector('#recordStatus').value=record?.status||'جديد';editDialog.showModal();document.querySelector('#recordTitle').focus();}
function fileJson(file){if(!file)throw Error('لم يُحدد ملف.');if(file.size>MAX_FILE)throw Error('الملف أكبر من الحد المسموح (8 ميغابايت).');return file.text().then(content=>JSON.parse(content));}
function loadDemo(){if((state.devices.some(device=>device.project)||Object.keys(state.cloud).length)&&!confirm('سيستبدل المثال الجلسة الحالية. صدّرها إلى JSON أولًا إذا أردت الاحتفاظ بها.'))return;state=fresh();importProject(0,{appName:'تطبيق المهام',pages:[{id:'tasks',title:'المهام',items:['راجع موعد الصيانة','أرسل التقرير']},{id:'calendar',title:'الجدول',items:['موعد زيارة']} ]},true);importProject(1,{appName:'تطبيق الملاحظات',pages:[{id:'notes',title:'الملاحظات',items:['فكرة واجهة جديدة']},{id:'folders',title:'المجلدات',items:['العمل']} ]},true);const first=Object.keys(state.devices[0].records)[0];shareRecord(0,first);syncDevice(0,true);syncDevice(1,true);state.devices[1].activePage=SHARED_PAGE;log('مثال عام: تطبيقان مختلفان؛ سجل واحد منشور، وبقية الصفوف خاصة.');persist();render();notify('فُتح مثال التطبيقين. عدّل السجل المشترك على الهاتف الثاني ثم زامن الجهازين.');}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action,index=Number(button.dataset.device),id=button.dataset.id,device=state.devices[index];
 if(action==='export')downloadSession();else if(action==='show-json')openJson();else if(action==='demo')loadDemo();else if(action==='reset'){if(confirm('بدء جلسة جديدة؟ صدّر الجلسة الحالية أولًا إن أردت الاحتفاظ بها.')){state=fresh();persist();render();notify('بدأت جلسة فارغة للهاتفين.');}}
 else if(action==='sync-both'){const first=syncDevice(0,true),second=syncDevice(1,true);if(first&&second)syncDevice(0,true);notify(first&&second?'اكتملت جولة التبادل. راجع السجل المشترك والتعارضات.':'تعذرت مزامنة أحد التطبيقين؛ راجع الاتصال وتوافر الحساب.');}
 else if(action==='sync')syncDevice(index);else if(action==='page'){device.activePage=button.dataset.page;persist();render();}else if(action==='add')openEdit(index,null);else if(action==='edit')openEdit(index,id);else if(action==='share')shareRecord(index,id);else if(action==='toggle'){const record=device.records[id];changeRecord(index,id,{status:record.status==='مكتمل'?'جارٍ':'مكتمل'});}else if(action==='delete'){const record=device.records[id];if(!record.shared||confirm('حذف السجل المشترك سينتقل إلى التطبيق الآخر عند المزامنة. هل تتابع؟'))changeRecord(index,id,{deleted:true});}else if(action==='resolve-local')resolveConflict(index,id,'local');else if(action==='resolve-remote')resolveConflict(index,id,'remote');});
 document.addEventListener('change',async event=>{const input=event.target;try{if(input.matches('[data-import-project]')){const index=Number(input.dataset.importProject),project=await fileJson(input.files[0]);if(!importProject(index,project))input.value='';}else if(input.id==='sessionFile'){const imported=await fileJson(input.files[0]);state=validateSession(imported);log('استُعيدت جلسة التطبيقين ومساحة التبادل من JSON.');persist();render();notify('استُعيد التطبيقان وبياناتهما.');}else if(input.matches('[data-global-setting]')){const field=input.dataset.globalSetting;if(['online','signedIn'].includes(field))state.identity[field]=input.checked;else if(['account','container'].includes(field)){if(state.devices.some(device=>device.project)||Object.keys(state.cloud).length){notify('ابدأ جلسة جديدة لتغيير هوية الحساب أو المساحة.');render();return;}state.identity[field]=text(input.value,80);}log(`تغيّر إعداد iPhone المشترك: ${field}.`);persist();render();}}catch(error){notify(`تعذر الاستيراد: ${error.message}`);input.value='';}});
 document.querySelector('#recordForm').addEventListener('submit',event=>{if(event.submitter?.value!=='save'||!editing)return;const title=text(document.querySelector('#recordTitle').value,100);if(!title){event.preventDefault();notify('أدخل عنوانًا للسجل.');return;}const {index,id}=editing,device=state.devices[index],note=text(document.querySelector('#recordNote').value,300),status=text(document.querySelector('#recordStatus').value,30);if(id)changeRecord(index,id,{title,note,status});else{const shared=device.activePage===SHARED_PAGE,page=device.pages.find(item=>item.key===device.activePage);const record={id:`${device.appId}::${device.activePage}::${uid()}`,pageKey:device.activePage,title,note,status,order:Object.keys(device.records).length,rev:0,deleted:false,shared,ownerAppId:device.appId,sourceApp:device.projectName,sourcePage:shared?'التبادل المشترك':page?.label||'',modifiedAt:new Date().toISOString()};device.records[record.id]=record;enqueue(device,record,'upsert');log(`أُضيف سجل ${shared?'مشترك':'خاص'} في ${device.projectName}: ${title}`);persist();render();}editing=null;notify(device.records[id]?.shared||device.activePage===SHARED_PAGE?'حُفظ محليًا؛ زامن التطبيقين لنقل التغيير.':'حُفظ في تطبيقك فقط. يمكنك مشاركته صراحةً لاحقًا.');});
document.querySelector('#closeJson').addEventListener('click',()=>jsonDialog.close());document.querySelector('#copyJson').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(document.querySelector('#jsonText').value);notify('نُسخ JSON الجلسة.');}catch{document.querySelector('#jsonText').select();notify('حدد النص وانسخه يدويًا من النافذة.');}});
render();
})();
</script>
